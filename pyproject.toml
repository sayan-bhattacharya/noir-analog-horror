[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "noir-film"
version = "0.2.0"
description = "Minimal, controllable, package-based visual engine for Project NOIR / Nishidak (THE NISHIDAK BROADCAST)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "soundfile>=0.12.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
]

[project.scripts]
noir-render = "noir_film.render_noir:main"
